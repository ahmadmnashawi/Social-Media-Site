 <div class="container">

<script src="setui.js">

<script>
  const urlparams = new URLSearchParams(window.location.search)
  const id = urlparams.get("postId")
  getpostdetalies()
  function getpostdetalies(){
    axios.get(`https://tarmeezacademy.com/api/v1/posts/${id}`)
    .then(response => {
      const post = response.data.data
      const comments = post.comments
      const author =post.author
      let commentsContent = ``
      for(coment of comments){
        commentsContent += `
        <div class="p-3" style="background-color:rgb(235,235,235)">
          <div>
              <img src="${coment.author.profile_image}" class="rounded-circle" style="width:40px;height:40px">
              <b>${coment.author.username}</b>
            </div>
            <div>
              ${coment.body}
              </div>
          </div>
        `
      }
      document.getElementById("user-name").innerHTML = author.name
      let postdetail = `
      <div class="card shadow">
        <div class="card-header">
            <img src="${author.profile_image}" alt="" style="width: 40px;height: 40px;margin-right:5px;" class="rounded-circle border border-1">
            <p class="d-inline"><b>${author.username}</b></p>
        </div>
        <div class="card-body">
            <img src="${post.image}" alt="" style="width: 100%;">
            <h6 style="color:rgb(193, 193, 193) ;" class="mt-1">${post.created_at}</h6>
            <h5>${post.title ? post.title: ""}</h5>
            <p>${post.body}</p>
            <hr>
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
                <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
                </svg>
                <span>(${post.comments_count}) Comment</span>
            </div>
        </div>
        <div id="comments">
          ${commentsContent}
          </div>
          <div class="d-flex pb-2" id="comment-bar">
          <input type="text" class="form-control" id="comment-user" placeholder="write new comment">
          <button onclick="creatcomment()" type="button" class="btn btn-primary bold">Send</button>
          </div>
        </div>
      `
      document.getElementById("post-detalies").innerHTML = postdetail
      setUi()
    })
    
  } 
    setUi()
    function creatcomment(){
      const newcomment = document.getElementById("comment-user").value
      let token = localStorage.getItem("token")
      let params = {
        "body":newcomment
      }
       const header = {
        "authorization":`Bearer ${token}`
    }
      axios.post(`https://tarmeezacademy.com/api/v1/posts/${id}/comments`,params,{
        headers:header
      })
      .then(response => {
        showsucc("comment has been created successfully",'success')
        getpostdetalies()
      }).catch((error) => {
        const errorm = error.response.data.message
        showsucc(errorm,'danger')
      })
    }
</script>
